<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Local Memory RAG architecture</title>
  <desc id="desc">Production agents call a loopback authenticated service that combines SQLite and local EmbeddingGemma with Zvec over a private Markdown vault, returning relative citations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07151f"/>
      <stop offset="1" stop-color="#102838"/>
    </linearGradient>
    <linearGradient id="local" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12394a"/>
      <stop offset="1" stop-color="#0d2b38"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5de0c3"/>
    </marker>
    <style>
      .sans { font-family: 'Instrument Sans', 'PingFang SC', sans-serif; }
      .mono { font-family: 'IBM Plex Mono', 'SFMono-Regular', monospace; }
      .muted { fill: #9bb1bd; }
      .white { fill: #f4f1e8; }
      .teal { fill: #5de0c3; }
      .line { stroke: #5de0c3; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #2b5361; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="70" r="330" fill="#153b4b" opacity="0.35"/>
  <circle cx="120" cy="860" r="280" fill="#0b3140" opacity="0.55"/>

  <g class="sans">
    <text x="92" y="90" class="white" font-size="47" font-weight="700">Local Memory RAG</text>
    <text x="94" y="130" class="muted" font-size="20" letter-spacing="1">PRIVATE KNOWLEDGE, ON-DEVICE RETRIEVAL, CITED EVIDENCE</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="85" y="235" width="290" height="430" rx="30" fill="#f1ede2"/>
    <text x="120" y="284" class="mono" fill="#61717b" font-size="15">01 / REPLACEABLE HOST</text>
    <text x="120" y="335" class="sans" fill="#102838" font-size="27" font-weight="700">Production Agent</text>
    <g class="sans" font-size="22" fill="#102838">
      <rect x="120" y="380" width="220" height="62" rx="16" fill="#dfe7e5"/>
      <text x="150" y="419">Qoder</text>
      <rect x="120" y="460" width="220" height="62" rx="16" fill="#dfe7e5"/>
      <text x="150" y="499">WorkBuddy</text>
      <rect x="120" y="540" width="220" height="62" rx="16" fill="#dfe7e5"/>
      <text x="150" y="579">TRAE Work</text>
    </g>
    <text x="120" y="635" class="mono" fill="#61717b" font-size="15">same portable Skill</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="460" y="170" width="770" height="590" rx="38" fill="url(#local)" stroke="#5de0c3" stroke-width="2"/>
    <rect x="490" y="197" width="190" height="38" rx="19" fill="#5de0c3"/>
    <text x="514" y="222" class="mono" fill="#07151f" font-size="15" font-weight="700">LOCAL-ONLY BOUNDARY</text>
    <text x="500" y="292" class="sans white" font-size="35" font-weight="700">Loopback retrieval service</text>
    <text x="500" y="326" class="mono muted" font-size="16">127.0.0.1 · bearer auth · no CORS · offline model</text>

    <rect x="500" y="375" width="215" height="230" rx="24" fill="#0a202b" stroke="#2b5361"/>
    <text x="530" y="416" class="mono teal" font-size="15">EXACT</text>
    <text x="530" y="460" class="sans white" font-size="28" font-weight="700">SQLite / FTS</text>
    <text x="530" y="500" class="sans muted" font-size="18">keywords</text>
    <text x="530" y="532" class="sans muted" font-size="18">fields + status</text>
    <text x="530" y="564" class="sans muted" font-size="18">open loops</text>

    <rect x="755" y="375" width="430" height="230" rx="24" fill="#0a202b" stroke="#2b5361"/>
    <text x="785" y="416" class="mono teal" font-size="15">SEMANTIC</text>
    <text x="785" y="460" class="sans white" font-size="28" font-weight="700">EmbeddingGemma + Zvec</text>
    <text x="785" y="500" class="sans muted" font-size="18">pinned ModelScope revision</text>
    <text x="785" y="532" class="sans muted" font-size="18">768-dim local embeddings</text>
    <text x="785" y="564" class="sans muted" font-size="18">process-serialized vector search</text>

    <rect x="500" y="642" width="685" height="70" rx="20" fill="#143f4a"/>
    <text x="530" y="685" class="mono white" font-size="17">HYBRID → dedupe → filter → bounded evidence</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1310" y="240" width="225" height="420" rx="30" fill="#f1ede2"/>
    <text x="1340" y="284" class="mono" fill="#61717b" font-size="14">03 / SOURCE OF TRUTH</text>
    <path d="M1350 350 h145 v190 h-145 z" fill="#fffaf0" stroke="#102838" stroke-width="3"/>
    <path d="M1452 350 v43 h43" fill="none" stroke="#102838" stroke-width="3"/>
    <g stroke="#8a989e" stroke-width="3">
      <line x1="1377" y1="430" x2="1470" y2="430"/>
      <line x1="1377" y1="463" x2="1470" y2="463"/>
      <line x1="1377" y1="496" x2="1444" y2="496"/>
    </g>
    <text x="1340" y="586" class="sans" fill="#102838" font-size="23" font-weight="700">Markdown Vault</text>
    <text x="1340" y="620" class="mono" fill="#61717b" font-size="12">human-readable · Git-ready</text>
  </g>

  <path d="M375 445 C410 445 425 445 460 445" class="line"/>
  <text x="392" y="420" class="mono teal" font-size="14">client.py</text>
  <path d="M1230 445 C1260 445 1275 445 1310 445" class="line"/>
  <text x="1245" y="420" class="mono teal" font-size="14">read-only</text>

  <path d="M460 540 C425 540 410 540 375 540" class="line"/>
  <text x="390" y="576" class="mono teal" font-size="14">relative citation</text>

  <g class="mono" font-size="15">
    <rect x="86" y="798" width="1428" height="54" rx="18" fill="#07151f" stroke="#244553"/>
    <circle cx="120" cy="825" r="8" fill="#ff8b6a"/>
    <text x="145" y="831" class="white">STAYS LOCAL:</text>
    <text x="280" y="831" class="muted">vault text · queries · model inputs · absolute paths · bearer token</text>
    <text x="1260" y="831" class="teal">mode=hybrid</text>
  </g>
</svg>
